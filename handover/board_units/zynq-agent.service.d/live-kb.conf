# ★ agent 启动前先刷新【实时状态】知识块
#
# 为什么：live_chunks.jsonl 里的温度/服务/变更记录是【会过期的】。
# 如果只在部署时生成一次，agent 回答"现在多少度"就会拿到几小时前的数字
# （而"现在多少度"恰好会被规则层接走，所以这个问题看不出来；
#   但问"温度高不高""服务都正常吗"就会答成旧的）。
#
# Type=oneshot 的 ExecStartPre 是同步执行的，失败也不挡住 agent 启动
# （前面那个 "-" 就是"失败也继续"）。
[Service]
ExecStartPre=-/usr/bin/python3 /home/zynq/live_kb.py
