# Minetest 低配配置 —— 为 Zynq-7020 (双核 A9 @667MHz, 软件渲染) 优化
# 目标: 尽量把每一帧的开销压到最低, 换一点帧率

# ---- 分辨率: 640x480, 只有 1024x600 的 37% 像素量 ----
screenW = 640
screenH = 480
fullscreen = false

# ---- 帧率上限: 别去追 60, 追不上反而更卡 ----
fps_max = 30
vsync = false

# ---- 视距: 这是 3D 性能最大的开关 ----
viewing_range = 40
active_block_range = 1
max_block_generate_distance = 4
max_block_send_distance = 3
client_mapblock_limit = 1000

# ---- 关掉所有花哨效果 ----
enable_shaders = false
enable_3d_clouds = false
smooth_lighting = false
leaves_style = simple
opaque_water = true
connected_glass = false
enable_waving_plants = false
enable_waving_leaves = false
enable_dynamic_shadows = false
tonemapping = false
enable_bloom = false
enable_volumetric_lighting = false
enable_node_specular = false
enable_fog = false
near_plane = 0.1

# ---- 光照: 用最简单的 ----
lighting_mode = 0

# ---- 纹理: 小一点, 少占带宽 ----
texture_min_size = 32
mip_map = false
anisotropic_filter = 1
bilinear_filter = false
trilinear_filter = false

# ---- 其它省 CPU 的开关 ----
video_driver = opengl
sound_volume = 0
enable_sound = false
enable_client_modding = false
serverlist_url =
menu_clouds = false
