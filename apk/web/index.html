<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b1020">
<title>系统管家小白</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  background:#0b1020;color:#e8eefc;
  display:flex;flex-direction:column;
  height:100dvh;
  padding-top:env(safe-area-inset-top);
  padding-bottom:env(safe-area-inset-bottom);
}
/* ---------- 顶栏 ---------- */
#top{
  flex:0 0 auto;height:52px;display:flex;align-items:center;
  padding:0 14px;gap:10px;
  background:linear-gradient(180deg,#151d33,#111827);
  border-bottom:1px solid #1e2947;
}
#top .logo{
  width:30px;height:30px;border-radius:9px;flex:0 0 auto;
  background:linear-gradient(135deg,#5678f6,#8b5cf6);
  display:flex;align-items:center;justify-content:center;
  font-size:15px;font-weight:700;color:#fff;
}
#top .title{font-size:16px;font-weight:600;flex:1}
#top .dot{
  width:9px;height:9px;border-radius:50%;background:#5a6478;
  flex:0 0 auto;transition:background .3s;
}
#top .dot.ok{background:#33d17a;box-shadow:0 0 8px #33d17a}
#top .dot.bad{background:#ef5350;box-shadow:0 0 8px #ef5350}

/* ---------- 内容区 ---------- */
#pages{flex:1 1 auto;position:relative;overflow:hidden}
.page{
  position:absolute;inset:0;display:none;flex-direction:column;
  overflow:hidden;
}
.page.active{display:flex}

/* ---------- 聊天 ---------- */
#chatList{
  flex:1 1 auto;overflow-y:auto;padding:12px 12px 4px;
  -webkit-overflow-scrolling:touch;
}
.msg{display:flex;margin-bottom:12px;gap:8px;align-items:flex-start}
.msg.me{flex-direction:row-reverse}
.msg .av{
  width:30px;height:30px;border-radius:9px;flex:0 0 auto;
  display:flex;align-items:center;justify-content:center;
  font-size:13px;font-weight:700;
}
.msg.bot .av{background:linear-gradient(135deg,#5678f6,#8b5cf6);color:#fff}
.msg.me .av{background:#243052;color:#9fb4dd}
.bubble{
  max-width:78%;padding:10px 13px;border-radius:14px;
  font-size:15px;line-height:1.55;word-break:break-word;white-space:pre-wrap;
}
.msg.bot .bubble{background:#1a2440;border-top-left-radius:4px}
.msg.me .bubble{background:#2f4bd6;border-top-right-radius:4px;color:#fff}
.msg .ts{font-size:11px;color:#5f6d8c;margin-top:4px}
.typing{display:inline-flex;gap:4px;align-items:center;padding:4px 2px}
.typing i{width:6px;height:6px;border-radius:50%;background:#6b7ba3;animation:bl 1.2s infinite}
.typing i:nth-child(2){animation-delay:.2s}
.typing i:nth-child(3){animation-delay:.4s}
@keyframes bl{0%,60%,100%{opacity:.3;transform:translateY(0)}30%{opacity:1;transform:translateY(-3px)}}

/* ---------- 输入栏 ---------- */
#composer{
  flex:0 0 auto;display:flex;gap:8px;padding:9px 12px;
  background:#0f1729;border-top:1px solid #1e2947;align-items:flex-end;
}
#chatText{
  flex:1;min-height:40px;max-height:110px;resize:none;
  background:#18213a;border:1px solid #26324f;border-radius:20px;
  color:#e8eefc;font-size:15px;padding:10px 15px;
  font-family:inherit;line-height:1.4;outline:none;
}
#chatText:focus{border-color:#3d5aa8}
#sendBtn{
  width:40px;height:40px;flex:0 0 auto;border:none;border-radius:50%;
  background:linear-gradient(135deg,#5678f6,#8b5cf6);color:#fff;
  font-size:17px;cursor:pointer;
}
#sendBtn:disabled{opacity:.45}

/* ---------- 状态页 ---------- */
#statusWrap{flex:1;overflow-y:auto;padding:14px}
.card{
  background:#141c31;border:1px solid #202b46;border-radius:14px;
  padding:14px;margin-bottom:12px;
}
.card h3{font-size:13px;color:#8fa3c8;font-weight:600;margin-bottom:10px;letter-spacing:.5px}
.kv{display:flex;justify-content:space-between;padding:7px 0;font-size:14px;
    border-bottom:1px solid #1b2338}
.kv:last-child{border-bottom:none}
.kv .k{color:#8fa3c8}
.kv .v{color:#e8eefc;font-weight:500;text-align:right;max-width:60%;word-break:break-all}
.bar{height:7px;border-radius:4px;background:#1d2740;overflow:hidden;margin-top:6px}
.bar>i{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,#5678f6,#33d17a);transition:width .4s}

/* ---------- 文件页 ---------- */
#fsWrap{flex:1;display:flex;flex-direction:column;overflow:hidden}
#fsPath{
  flex:0 0 auto;padding:9px 12px;font-size:13px;color:#8fa3c8;
  background:#0f1729;border-bottom:1px solid #1e2947;
  font-family:ui-monospace,Menlo,monospace;white-space:nowrap;overflow-x:auto;
}
#fsList{flex:1;overflow-y:auto}
.fsItem{
  display:flex;align-items:center;gap:11px;padding:12px 14px;
  border-bottom:1px solid #18213a;font-size:14px;cursor:pointer;
}
.fsItem:active{background:#18213a}
.fsItem .ic{font-size:19px;width:24px;text-align:center;flex:0 0 auto}
.fsItem .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fsItem .sz{font-size:12px;color:#6b7ba3;flex:0 0 auto}

/* ---------- 设置页 ---------- */
#setWrap{flex:1;overflow-y:auto;padding:14px}
.field{margin-bottom:14px}
.field label{display:block;font-size:13px;color:#8fa3c8;margin-bottom:6px}
.field input{
  width:100%;background:#18213a;border:1px solid #26324f;border-radius:10px;
  color:#e8eefc;font-size:15px;padding:12px;outline:none;font-family:inherit;
}
.field input:focus{border-color:#3d5aa8}
.btn{
  width:100%;padding:13px;border:none;border-radius:11px;font-size:15px;
  font-weight:600;cursor:pointer;font-family:inherit;
  background:linear-gradient(135deg,#5678f6,#8b5cf6);color:#fff;margin-bottom:10px;
}
.btn.ghost{background:#1c2640;color:#b8c7e6;border:1px solid #2b3a5c}
.btn:active{opacity:.85}
.hint{font-size:12px;color:#6b7ba3;line-height:1.6;margin-top:8px}

/* ---------- 底部导航 ---------- */
#nav{
  flex:0 0 auto;display:flex;height:56px;
  background:#0f1729;border-top:1px solid #1e2947;
}
#nav button{
  flex:1;background:none;border:none;color:#5f6d8c;font-size:11px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:3px;cursor:pointer;font-family:inherit;transition:color .2s;
}
#nav button .i{font-size:19px;line-height:1}
#nav button.on{color:#7d9bff}

/* ---------- toast ---------- */
#toast{
  position:fixed;left:50%;bottom:88px;transform:translateX(-50%) translateY(20px);
  background:#233052;color:#e8eefc;padding:10px 18px;border-radius:20px;
  font-size:13px;opacity:0;pointer-events:none;transition:all .25s;z-index:99;
  max-width:86vw;text-align:center;
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>

<div id="top">
  <div class="logo">小白</div>
  <div class="title">系统管家小白</div>
  <div class="dot" id="connDot"></div>
</div>

<div id="pages">

  <!-- ================= 聊天 ================= -->
  <div class="page active" id="pageChat">
    <div id="chatList"></div>
    <div id="composer">
      <textarea id="chatText" rows="1" placeholder="和小白说点什么…"></textarea>
      <button id="sendBtn">↑</button>
    </div>
  </div>

  <!-- ================= 状态 ================= -->
  <div class="page" id="pageStatus">
    <div id="statusWrap">
      <div class="card">
        <h3>板子状态</h3>
        <div id="stBasic"><div class="kv"><span class="k">加载中…</span><span class="v"></span></div></div>
      </div>
      <div class="card">
        <h3>温度 / 负载</h3>
        <div id="stThermal"><div class="kv"><span class="k">加载中…</span><span class="v"></span></div></div>
      </div>
      <div class="card">
        <h3>服务</h3>
        <div id="stSvc"><div class="kv"><span class="k">加载中…</span><span class="v"></span></div></div>
      </div>
      <button class="btn ghost" onclick="loadStatus()">刷新</button>
    </div>
  </div>

  <!-- ================= 文件 ================= -->
  <div class="page" id="pageFs">
    <div id="fsWrap">
      <div id="fsPath">/home/zynq</div>
      <div id="fsList"></div>
    </div>
  </div>

  <!-- ================= 设置 ================= -->
  <div class="page" id="pageSet">
    <div id="setWrap">
      <div class="field">
        <label>板子地址</label>
        <input id="setHost" placeholder="192.168.10.20">
      </div>
      <div class="field">
        <label>访问令牌（token）</label>
        <input id="setToken" placeholder="留空则自动尝试默认令牌">
      </div>
      <button class="btn" onclick="saveSettings()">保存并连接</button>
      <button class="btn ghost" onclick="autoScan()">自动扫描（试默认令牌）</button>
      <div class="hint">
        · 板子需和手机在同一 WiFi<br>
        · 端口固定 8768（cloud-api）<br>
        · 首次连接会自动探测默认令牌
      </div>
    </div>
  </div>

</div>

<div id="nav">
  <button class="on" data-page="chat"><span class="i">💬</span>聊天</button>
  <button data-page="status"><span class="i">📊</span>状态</button>
  <button data-page="fs"><span class="i">📁</span>文件</button>
  <button data-page="set"><span class="i">⚙️</span>设置</button>
</div>

<div id="toast"></div>

<script>
/* ============================================================
   系统管家小白 · 手机端
   API: cloud_api (8768)
   ============================================================ */

const DEFAULT_TOKENS = ["xb7k2m9q","u6kCWANi","123456",""];
const STORE_KEY = "xiaobai_apk_conf";

let S = {
  host: "",
  token: "",
  sessionId: "",
  online: false,
  busy: false,
  fsPath: "/home/zynq",
};

/* ---------- 配置 ---------- */
function loadConf(){
  try{
    const d = JSON.parse(localStorage.getItem(STORE_KEY) || "{}");
    if (d.host) S.host = d.host;
    if (d.token) S.token = d.token;
    if (d.sessionId) S.sessionId = d.sessionId;
  }catch(e){}
  document.getElementById("setHost").value = S.host || "";
  document.getElementById("setToken").value = S.token || "";
}
function saveConf(){
  localStorage.setItem(STORE_KEY, JSON.stringify({
    host:S.host, token:S.token, sessionId:S.sessionId
  }));
}

/* ---------- 工具 ---------- */
function toast(msg, ms){
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(t._tid);
  t._tid = setTimeout(()=>t.classList.remove("show"), ms||1800);
}
function setOnline(ok){
  S.online = !!ok;
  const d = document.getElementById("connDot");
  d.className = "dot " + (ok ? "ok" : "bad");
}
function esc(s){
  return String(s==null?"":s).replace(/[&<>"']/g, c=>({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[c]));
}
function fmtSize(n){
  n = Number(n)||0;
  if (n < 1024) return n + " B";
  if (n < 1048576) return (n/1024).toFixed(1) + " KB";
  if (n < 1073741824) return (n/1048576).toFixed(1) + " MB";
  return (n/1073741824).toFixed(2) + " GB";
}
function nowTs(){
  const d = new Date();
  const p = x => String(x).padStart(2,"0");
  return p(d.getHours())+":"+p(d.getMinutes());
}

/* ---------- HTTP ---------- */
async function api(path, opt){
  opt = opt || {};
  if (!S.host) throw new Error("还没设置板子地址");
  const url = "http://" + S.host + ":8768" + path;
  const init = {
    method: opt.method || "GET",
    headers: {}
  };
  if (S.token) init.headers["Authorization"] = "Bearer " + S.token;
  if (opt.body !== undefined){
    init.headers["Content-Type"] = "application/json";
    init.body = JSON.stringify(opt.body);
  }
  if (opt.timeout){
    const ac = new AbortController();
    init.signal = ac.signal;
    setTimeout(()=>ac.abort(), opt.timeout);
  }
  const r = await fetch(url, init);
  const txt = await r.text();
  let d;
  try { d = JSON.parse(txt); } catch(e){ d = {ok:false, error:txt.slice(0,200)}; }
  if (!r.ok) throw new Error(d.error || ("HTTP " + r.status));
  return d;
}
async function apiRaw(path){
  const url = "http://" + S.host + ":8768" + path;
  const init = {};
  if (S.token) init.headers = { "Authorization": "Bearer " + S.token };
  const r = await fetch(url, init);
  if (!r.ok) throw new Error("HTTP " + r.status);
  return await r.blob();
}

/* ---------- 连接探测 ---------- */
async function probeToken(){
  // /health 不需要 token；再用候选 token 试 /info
  if (!S.host) return false;
  try{
    const h = await fetch("http://" + S.host + ":8768/health").then(r=>r.json());
    if (!h || h.ok === false) return false;
  }catch(e){
    return false;
  }
  const cands = S.token ? [S.token] : DEFAULT_TOKENS.slice();
  for (const t of cands){
    try{
      const url = "http://" + S.host + ":8768/info";
      const init = {};
      if (t) init.headers = { "Authorization": "Bearer " + t };
      const r = await fetch(url, init);
      if (r.ok){
        const d = await r.json();
        if (d && d.ok !== false){
          S.token = t;
          saveConf();
          return true;
        }
      }
    }catch(e){}
  }
  return false;
}

async function connect(showToast){
  if (!S.host){ setOnline(false); return false; }
  const ok = await probeToken();
  setOnline(ok);
  if (showToast) toast(ok ? "已连接" : "连不上板子");
  if (ok) loadSessions();
  return ok;
}

/* ============================================================
   页面切换
   ============================================================ */
document.querySelectorAll("#nav button").forEach(b=>{
  b.onclick = ()=>{
    document.querySelectorAll("#nav button").forEach(x=>x.classList.remove("on"));
    b.classList.add("on");
    const pg = b.dataset.page;
    document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));
    document.getElementById("page" + pg.charAt(0).toUpperCase() + pg.slice(1)).classList.add("active");
    if (pg === "status") loadStatus();
    if (pg === "fs") loadFs(S.fsPath);
    if (pg === "chat") setTimeout(()=>{
      const el = document.getElementById("chatList");
      el.scrollTop = el.scrollHeight;
    }, 30);
  };
});

/* ============================================================
   聊天
   ============================================================ */
const chatList = document.getElementById("chatList");

function addMsg(who, text, ts){
  const d = document.createElement("div");
  d.className = "msg " + (who === "me" ? "me bot" : "bot");
  d.className = "msg " + (who === "me" ? "me" : "bot");
  d.innerHTML =
    '<div class="av">' + (who === "me" ? "我" : "白") + '</div>' +
    '<div><div class="bubble">' + esc(text) + '</div>' +
    '<div class="ts">' + (ts || nowTs()) + '</div></div>';
  chatList.appendChild(d);
  chatList.scrollTop = chatList.scrollHeight;
  return d;
}
function addTyping(){
  const d = document.createElement("div");
  d.className = "msg bot";
  d.id = "typingMsg";
  d.innerHTML = '<div class="av">白</div><div><div class="bubble">' +
    '<span class="typing"><i></i><i></i><i></i></span></div></div>';
  chatList.appendChild(d);
  chatList.scrollTop = chatList.scrollHeight;
}
function removeTyping(){
  const e = document.getElementById("typingMsg");
  if (e) e.remove();
}

async function sendChat(){
  const ta = document.getElementById("chatText");
  const text = ta.value.trim();
  if (!text || S.busy) return;
  ta.value = "";
  ta.style.height = "40px";
  addMsg("me", text);
  S.busy = true;
  document.getElementById("sendBtn").disabled = true;
  addTyping();
  try{
    const d = await api("/chat", {
      method:"POST",
      body:{ text: text, session_id: S.sessionId || undefined },
      timeout: 90000
    });
    removeTyping();
    if (d.ok === false) throw new Error(d.error || "失败");
    if (d.session_id){ S.sessionId = d.session_id; saveConf(); }
    const reply = d.reply || d.text || d.answer || (d.choices && d.choices[0] &&
      d.choices[0].message && d.choices[0].message.content) || "（无回复）";
    addMsg("bot", reply);
    setOnline(true);
  }catch(e){
    removeTyping();
    addMsg("bot", "⚠ 请求失败：" + e.message);
    setOnline(false);
  }finally{
    S.busy = false;
    document.getElementById("sendBtn").disabled = false;
  }
}

document.getElementById("sendBtn").onclick = sendChat;
document.getElementById("chatText").addEventListener("keydown", e=>{
  if (e.key === "Enter" && !e.shiftKey){ e.preventDefault(); sendChat(); }
});
document.getElementById("chatText").addEventListener("input", function(){
  this.style.height = "40px";
  this.style.height = Math.min(110, this.scrollHeight) + "px";
});

async function loadSessions(){
  try{
    const d = await api("/chat/sessions?limit=1");
    if (d.ok && d.sessions && d.sessions.length && !S.sessionId){
      // 不自动恢复上次会话，留空表示新会话
    }
  }catch(e){}
}

/* ============================================================
   状态
   ============================================================ */
function kv(k, v){
  return '<div class="kv"><span class="k">' + esc(k) + '</span>' +
         '<span class="v">' + esc(v) + '</span></div>';
}
async function loadStatus(){
  const e1 = document.getElementById("stBasic");
  const e2 = document.getElementById("stThermal");
  const e3 = document.getElementById("stSvc");
  e1.innerHTML = kv("加载中…", "");
  e2.innerHTML = ""; e3.innerHTML = "";
  try{
    const info = await api("/info", { timeout: 15000 });
    if (info.ok === false) throw new Error(info.error || "info 失败");
    let h = "";
    if (info.uptime_s != null){
      const s = Number(info.uptime_s);
      h += kv("运行时长", Math.floor(s/3600) + " 小时 " + Math.floor((s%3600)/60) + " 分");
    } else if (info.uptime){
      h += kv("运行时长", info.uptime);
    }
    if (info.ip) h += kv("IP", info.ip);
    if (info.mac) h += kv("MAC", info.mac);
    if (info.hostname) h += kv("主机名", info.hostname);
    if (info.bit && info.bit.file){
      h += kv("bitstream", info.bit.file.split("/").pop() + " · " + fmtSize(info.bit.size));
      if (info.bit.mtime) h += kv("bit 时间", info.bit.mtime);
    }
    if (info.board) h += kv("板卡", info.board);
    if (info.kernel) h += kv("内核", info.kernel);
    e1.innerHTML = h || kv("（无数据）", "");
    setOnline(true);
  }catch(e){
    e1.innerHTML = kv("失败", e.message);
    setOnline(false);
  }

  try{
    const t = await api("/hw/thermal", { timeout: 12000 });
    let h = "";
    const d = t.data || t;
    if (d.temp_c != null){
      h += kv("温度", d.temp_c + " °C");
      const pct = Math.max(0, Math.min(100, (d.temp_c / 85) * 100));
      h += '<div class="bar"><i style="width:' + pct + '%"></i></div>';
    }
    if (d.cpu_pct != null){
      h += kv("CPU", d.cpu_pct + " %");
      h += '<div class="bar"><i style="width:' + d.cpu_pct + '%"></i></div>';
    }
    if (d.mem_pct != null){
      h += kv("内存", d.mem_pct + " %");
      h += '<div class="bar"><i style="width:' + d.mem_pct + '%"></i></div>';
    }
    if (d.governor) h += kv("调频", d.governor);
    if (!h) h = kv("（无数据）", "");
    e2.innerHTML = h;
  }catch(e){
    e2.innerHTML = kv("失败", e.message);
  }

  try{
    const s = await api("/hw/services", { timeout: 15000 });
    let list = s.services || s.data || [];
    if (!Array.isArray(list)) list = [];
    let h = "";
    list.slice(0, 14).forEach(v=>{
      const nm = v.name || v.unit || v;
      const st = v.active || v.state || "";
      h += kv(nm, st);
    });
    e3.innerHTML = h || kv("（无数据）", "");
  }catch(e){
    e3.innerHTML = kv("失败", e.message);
  }
}

/* ============================================================
   文件
   ============================================================ */
const ICON = {
  dir:"📁", py:"🐍", wav:"🎵", mp3:"🎵", txt:"📄", md:"📝",
  json:"🧩", bit:"💾", bin:"💾", png:"🖼", jpg:"🖼", default:"📄"
};
function fsIcon(name, isDir){
  if (isDir) return ICON.dir;
  const ext = (name.split(".").pop() || "").toLowerCase();
  return ICON[ext] || ICON.default;
}
async function loadFs(path){
  S.fsPath = path || "/home/zynq";
  document.getElementById("fsPath").textContent = S.fsPath;
  const el = document.getElementById("fsList");
  el.innerHTML = '<div class="fsItem"><span class="ic">⏳</span><span class="nm">加载中…</span></div>';
  try{
    const d = await api("/fs/list?path=" + encodeURIComponent(S.fsPath), { timeout: 20000 });
    if (d.ok === false) throw new Error(d.error || "list 失败");
    let items = d.items || d.files || d.list || [];
    items = items.slice().sort((a,b)=>{
      const ad = a.is_dir || a.dir || a.type === "dir";
      const bd = b.is_dir || b.dir || b.type === "dir";
      if (ad !== bd) return ad ? -1 : 1;
      return String(a.name||"").localeCompare(String(b.name||""));
    });
    let html = "";
    if (S.fsPath !== "/" && S.fsPath.split("/").filter(Boolean).length > 0){
      const up = S.fsPath.replace(/\/[^/]+$/, "") || "/";
      html += '<div class="fsItem" onclick="loadFs(\'' + up.replace(/'/g,"\\'") + '\')">' +
              '<span class="ic">⬆️</span><span class="nm">返回上级</span></div>';
    }
    items.forEach(it=>{
      const nm = it.name || "";
      const isDir = !!(it.is_dir || it.dir || it.type === "dir");
      const sz = isDir ? "" : fmtSize(it.size);
      const full = (S.fsPath.replace(/\/$/,"") + "/" + nm);
      html += '<div class="fsItem" onclick="onFsClick(' + JSON.stringify(full) + ',' + isDir + ')">' +
              '<span class="ic">' + fsIcon(nm, isDir) + '</span>' +
              '<span class="nm">' + esc(nm) + '</span>' +
              '<span class="sz">' + sz + '</span></div>';
    });
    el.innerHTML = html || '<div class="fsItem"><span class="ic">📭</span><span class="nm">空目录</span></div>';
  }catch(e){
    el.innerHTML = '<div class="fsItem"><span class="ic">⚠️</span><span class="nm">' +
                   esc(e.message) + '</span></div>';
  }
}
async function onFsClick(full, isDir){
  if (isDir){ loadFs(full); return; }
  toast("下载 " + full.split("/").pop() + " …");
  try{
    const blob = await apiRaw("/fs/download?path=" + encodeURIComponent(full));
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = full.split("/").pop();
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href), 8000);
    toast("已保存");
  }catch(e){
    toast("下载失败：" + e.message);
  }
}

/* ============================================================
   设置
   ============================================================ */
async function saveSettings(){
  const h = document.getElementById("setHost").value.trim();
  const t = document.getElementById("setToken").value.trim();
  S.host = h.replace(/^https?:\/\//,"").replace(/\/.*$/,"").replace(/:\d+$/,"");
  S.token = t;
  S.sessionId = "";
  saveConf();
  toast("已保存，正在连接…");
  await connect(true);
  if (S.online){ addMsg("bot", "已连接到板子 " + S.host + "，我是系统管家小白，有什么可以帮你？"); }
}
async function autoScan(){
  toast("尝试连接…");
  await connect(true);
  if (S.online){
    document.getElementById("setHost").value = S.host;
    document.getElementById("setToken").value = S.token;
    toast("连接成功");
  }
}

/* ============================================================
   启动
   ============================================================ */
loadConf();
addMsg("bot", "你好，我是系统管家小白 👋\n先在「设置」里填板子地址，然后就能聊天了。");
if (S.host){
  connect(false).then(ok=>{
    if (ok) addMsg("bot", "已连接 " + S.host + "，可以开始对话了。");
  });
}
// 定时探活
setInterval(()=>{ if (S.host && !S.busy) connect(false); }, 30000);
</script>
