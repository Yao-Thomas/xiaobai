Section "ServerLayout"
    Identifier "layout"
    Screen 0 "screen" 0 0
EndSection

Section "Monitor"
    Identifier "lcd"
    HorizSync   30-70
    VertRefresh 50-75
    Option "DPMS" "false"
EndSection

Section "Device"
    Identifier "zyna-fb"
    Driver "fbdev"
    Option "fbdev" "/dev/fb0"
EndSection

Section "Screen"
    Identifier "screen"
    Device "zyna-fb"
    Monitor "lcd"
    DefaultDepth 24
    SubSection "Display"
        Depth 24
        Modes "1024x600"
    EndSubSection
EndSection
